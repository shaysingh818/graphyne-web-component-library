# Publishes @graphyne/web-components to npm whenever a GitHub Release is
# published. Requires an NPM_TOKEN secret (Settings → Secrets and variables →
# Actions → New repository secret) holding an npm "Automation" access token
# for the account/org that owns the @graphyne scope.
#
# Release flow: land changes on a branch, PR into main as usual, bump the
# version in packages/web-components/package.json as part of that PR (or a
# follow-up one) — then, once it's on main, create a GitHub Release whose
# tag matches the version (e.g. `gh release create v0.1.3 --target main`,
# or Releases → Draft a new release in the UI). Publishing that release is
# what fires this workflow — a plain `git push --tags` no longer does.
name: Publish @graphyne/web-components to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @graphyne/web-components run test

      - name: Typecheck
        run: pnpm --filter @graphyne/web-components run typecheck

      - name: Build
        run: pnpm --filter @graphyne/web-components run build

      - name: Publish
        run: pnpm --filter @graphyne/web-components publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
