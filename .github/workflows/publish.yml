# Publishes @graphyne/core to npm whenever a version tag (v*, e.g. v0.1.0)
# is pushed. Requires an NPM_TOKEN secret (Settings → Secrets and variables →
# Actions → New repository secret) holding an npm "Automation" access token
# for the account/org that owns the @graphyne scope.
name: Publish @graphyne/core to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @graphyne/core run test

      - name: Typecheck
        run: pnpm --filter @graphyne/core run typecheck

      - name: Build
        run: pnpm --filter @graphyne/core run build

      - name: Publish
        run: pnpm --filter @graphyne/core publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
