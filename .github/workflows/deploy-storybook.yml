# Builds the @graphyne/core Storybook (the component docs/demo site) and
# publishes it to GitHub Pages. Uses the official GitHub Pages actions
# (OIDC-based deploy, no gh-pages branch, no PAT secret needed) rather than
# a third-party deploy action.
#
# One-time setup required in the repo: Settings → Pages → Source:
# "GitHub Actions" (not "Deploy from a branch").
name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a redeploy manually from the Actions tab without a push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment should run at a time; don't cancel one that's
# already in progress if another push comes in.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root script (see package.json) forwards to `@graphyne/core`, whose
      # own build-storybook script outputs to packages/core/storybook-static.
      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/core/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
